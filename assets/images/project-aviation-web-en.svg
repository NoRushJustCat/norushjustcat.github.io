  </g>
  <text x="50" y="380" fill="#f0f6fc" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="bold">Aircraft Accident Investigator</text>
  <text x="50" y="410" fill="#9ab3cf" font-family="sans-serif" font-size="15">Web tool for flight-data analysis, timeline reconstruction and telemetry</text>
</svg>