<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141610"/>
      <stop offset="100%" stop-color="#0d0e0b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg4)"/>
  <!-- Trajectoire de vol 3D / Télémétrie d'enquête -->
  <path d="M80 180 Q 250 80, 420 220 T 720 160" fill="none" stroke="#d9a066" stroke-width="3"/>
  <circle cx="420" cy="220" r="8" fill="#c9b18a"/>
  <circle cx="420" cy="220" r="16" fill="none" stroke="#c9b18a" stroke-width="1.5" stroke-dasharray="3 3"/>
  <!-- Courbes télémétriques altimètre et vitesse -->
  <path d="M100 320 L220 300 L340 330 L460 270 L580 340 L700 310" fill="none" stroke="#93a786" stroke-width="2"/>
  <!-- Badge Aviation Web -->
  <g transform="translate(630, 30)">
    <rect x="0" y="0" width="140" height="30" rx="6" fill="#1b1d17" stroke="#d9a066" stroke-width="1.5"/>
    <text x="70" y="20" fill="#d9a066" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">AVIATION • WEB</text>
  </g>
  <text x="50" y="380" fill="#f3eddf" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="bold">Enquêteur d'Accident Aérien</text>
  <text x="50" y="410" fill="#c2baa8" font-family="sans-serif" font-size="15">Outil web d'analyse de données de vol, reconstitution chronologique et télémétrie</text>
</svg>